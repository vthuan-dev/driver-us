server {
    server_name driverusa.site www.driverusa.site us.180-93-35-55.sslip.io;

    root /var/www/driver-us/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # API Proxy to backend (port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Static file caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/driverusa.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/driverusa.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.driverusa.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = driverusa.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name driverusa.site www.driverusa.site us.180-93-35-55.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/driver-us/frontend/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
